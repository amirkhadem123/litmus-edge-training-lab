services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - litmus_data:/data
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  litmus_data:
