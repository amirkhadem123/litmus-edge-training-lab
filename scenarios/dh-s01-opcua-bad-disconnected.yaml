      "Create monitored item 'ns=2;s=CNC_Line3.Spindle.BadRegister' failed: BadNodeIdUnknown"
      "Create monitored item 'ns=2;s=CNC_Line3.Aux.TestPoint99' failed: BadNodeIdUnknown"
