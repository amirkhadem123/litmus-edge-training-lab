id: cp-03
title: "DeviceHub restarts every few hours, disconnecting all devices"
mode: certificate
checkpoint: 3
difficulty: advanced
expected_action: escalate

customer:
  name: James Okonkwo
  company: Maritime Logistics Corp
  le_version: "4.0.6"
  role: Controls Lead
  litmus_certified: true
  ui_access: true
  technical_level: high

ticket:
  subject: "DeviceHub restarts every few hours, disconnecting all devices"
  initial_message: |
    Hi,

    We are experiencing a critical issue with our Litmus Edge instance. The DeviceHub
    service appears to restart itself roughly every 4–6 hours, and every time it does,
    all of our devices lose connection simultaneously. We get data gaps in the historian
    that correspond exactly to the restart timestamps.

    This has been happening for approximately three days. We have 14 devices connected,
    including a large OPC UA device ("Vessel-Track-OPC1") with approximately 3,200 tags.
    We're running Litmus Edge 4.0.6. I've checked the admin panel and can see
    "DeviceHub service: process terminated — OOM restart" entries at each event.

    I can't identify the root cause from the web interface alone. Escalation may be
    required — this is affecting production tracking.

    James Okonkwo
    Controls Lead
    Maritime Logistics Corp

platform_context: |
  Litmus Edge is a web-based industrial IoT platform accessed through a browser.

  DeviceHub — manages connected field devices. Shows a device list with status badges:
  green "Connected", grey "Stopped", red "Disconnected". Each device has a tag list
  and a configuration view. Clicking a device shows its detail including a device log
  with timestamped driver-level entries.

  Admin panel — accessible to admin users. Contains system-level logs showing service
  lifecycle events including restarts, errors, and status changes.

  OOM (Out of Memory) — when a process exhausts available system memory, the operating
  system terminates it. In Litmus Edge this appears in admin logs as an OOM restart
  entry for the affected service (in this case DeviceHub).

  SSH / CLI access — the Litmus Edge node runs on Linux. Process-level logs (beyond
  what the web interface exposes) require SSH or CLI access directly to the node. This
  is not always available to customers due to security policies.

  OPC UA high tag counts — the Litmus Edge OPC UA driver manages subscriptions for
  each monitored tag. Very large tag counts (thousands of monitored items) place
  significant load on the driver's internal memory management structures.

customer_persona: |
  James is a Controls Lead at a maritime logistics company. He is technically experienced,
  has completed the Litmus User Certificate, and is comfortable navigating the Litmus Edge
  admin interface independently. He understands OPC UA, knows what OOM means when he sees
  it in a log, and can describe what he observes with precision. He has already done initial
  investigation before submitting the ticket and he is genuinely stumped. He is under
  pressure — this is a production system — but communicates professionally and methodically.
  He will not exaggerate. He will not understate. If he does not know something, he says so.
  He cannot provide SSH or CLI access to the LE node due to his company's IT security policy.

customer_knowledge:
  observes: |
    The DeviceHub service restarts roughly every 4 to 6 hours with no manual trigger.
    Each restart causes all 14 connected devices to drop simultaneously and reconnect
    within a few minutes, creating data gaps in the historian. This has been happening
    for approximately three days. He has checked the Litmus Edge admin panel and can see
    "DeviceHub service: process terminated — OOM restart" entries at each event timestamp.
    One of the connected devices — "Vessel-Track-OPC1" — is an OPC UA device with
    approximately 3,200 tags, added when they expanded their vessel tracking system
    six months ago. The instance was upgraded from 4.0.4 to 4.0.6 about one month ago.
  can_do: |
    Navigate the Litmus Edge web interface and admin panel independently. Check logs
    available through the web interface. Look at device configuration and tag counts.
    Report specific log text, timestamps, and error messages accurately.
  does_not_know: |
    Why DeviceHub is restarting. That this is a known memory leak bug in the 4.0.x OPC UA
    driver under high tag counts. That the restarts are OOM kills triggered by the driver's
    unbounded memory growth with 3,200 monitored items. Any fix at the application level
    that does not require engineering intervention or a firmware patch.
  withheld:
    - info: >
        Maritime Logistics Corp has a regulatory compliance audit in 48 hours. The historian
        data feeds directly into a maritime authority reporting system, and any gaps in the
        record will require a formal explanation to the auditors. This makes the situation
        significantly more urgent than James initially indicated.
      release_when: >
        analyst asks about business impact, urgency, deadlines, regulatory requirements,
        what's at stake if the issue is not resolved quickly, or whether there is a
        specific timeline they are working against
  what_you_see: |
    System / admin logs (when asked to check):
      In the Litmus Edge admin panel under system logs, James can see entries at each
      restart timestamp reading: "DeviceHub service: process terminated — OOM restart".
      The timestamps match the disconnection events: approximately 2 AM, 7 AM, and
      1 PM yesterday, then again at 6 AM today. No prominent errors appear in the log
      immediately before each OOM entry — just the termination message itself.

    DeviceHub — device list (when asked):
      All 14 devices are visible. Most show "Connected" (green). During a restart
      window all show "Disconnected" briefly before recovering. Vessel-Track-OPC1
      is visible in the list. Its configuration shows approximately 3,200 tags.

    SSH / CLI access (when asked):
      James cannot provide this. His company's IT security policy restricts command-line
      access to production systems. He can only access what is available through the
      Litmus Edge web interface.

    Version information (when asked):
      The admin panel or about page shows Litmus Edge version 4.0.6. James recalls
      the upgrade from 4.0.4 happened approximately one month ago.

# ── Urgency injection — fires after customer's 3rd reply ─────────────────────
urgency_injection:
  enabled: true
  trigger_after_customer_message: 3
  text: |
    I should also mention — we just learned that our vessel tracking data feeds into a
    maritime authority compliance reporting system. We have a regulatory audit in 48 hours
    and the auditors will be reviewing our historian data. Any gaps in the record will
    require a formal explanation. This has become urgent from a compliance standpoint.

# ── Internal documentation (not shown to trainee — used by grading agent only) ─

root_cause: |
  The DeviceHub service on this Litmus Edge 4.0.6 instance is experiencing a memory leak
  in the OPC UA driver when managing a large number of monitored items. With 3,200+ tags on
  a single OPC UA device, the driver's internal subscription management structures grow
  unboundedly over time. After 4–6 hours of operation, the process exhausts available memory
  and the OS triggers an OOM kill, which restarts the DeviceHub service.

  This is a known bug in Litmus Edge 4.0.x for the OPC UA driver under high tag counts.
  A fix is in development but has not been released in a patch.

  The correct action is ESCALATION. The trainee cannot fix this at L0:
  - Cannot reduce tag count without customer approval and significant reconfiguration
  - Cannot apply a patch that does not yet exist
  - Cannot access the process-level logs needed for definitive confirmation (requires
    SSH/CLI which is blocked by the customer's IT security policy)

escalation_reason: |
  This is a platform-level bug in Litmus Edge 4.0.x — a memory leak in the OPC UA driver
  under high monitored item counts. No L0 fix exists. The customer cannot provide CLI
  access for deeper investigation. Escalation to L2 Engineering is required with a
  complete evidence package: version, OOM log evidence, device type and tag count,
  restart intervals, and the compliance deadline for priority setting.

correct_response_summary: |
  1. Confirm restart timing: every 4–6 hours, no manual trigger identified
  2. Retrieve system logs from LE admin panel: note "DeviceHub service: OOM restart" entries
  3. Identify Vessel-Track-OPC1 as having 3,200+ tags — flag as potential memory pressure source
  4. Correlate: restarts occur after sustained operation, not at startup
  5. Note that deeper process logs require SSH/CLI access the customer cannot provide
  6. After urgency injection: acknowledge the compliance deadline, adjust escalation priority
  7. Conclude: platform-level memory leak in 4.0.6 OPC UA driver, engineering intervention required
  8. Escalate with complete evidence package: version, device type and tag count, restart
     intervals, OOM log evidence, inaccessible CLI logs, compliance deadline

# ── Grading rubric ────────────────────────────────────────────────────────────

grading_rubric:
  pass_threshold: 70
  dimensions:
    - name: Proactive first response
      max_points: 15
      description: |
        Did the trainee respond with an organised, professional initial reply that
        acknowledged the severity, asked targeted diagnostic questions, and set
        appropriate expectations?

        Award 15 pts for a structured response with at least two specific closed
        diagnostic questions covering restart timing, log content, and/or device types.
        Award 8 pts for a professional response but with vague or generic questions.
        Award 0 pts for immediately suggesting a fix or restart without any
        diagnostic questions.

    - name: Urgency handling
      max_points: 20
      description: |
        Did the trainee appropriately acknowledge and act on the compliance deadline
        when James disclosed the 48-hour audit window?

        Award 20 pts for explicitly acknowledging the urgency, adjusting the
        escalation priority, and communicating a clear, specific commitment to James
        about next steps and timeline.
        Award 10 pts for acknowledging the urgency verbally but not adjusting the
        escalation approach or priority.
        Award 0 pts for ignoring the urgency disclosure or treating the ticket as
        routine after it was raised.

    - name: Investigation quality
      max_points: 20
      description: |
        Did the trainee systematically gather enough evidence to characterise the
        problem before escalating?

        Award 20 pts for collecting all of: restart intervals and frequency, OOM log
        evidence with specific log text, LE version, the high-tag-count OPC UA device
        (Vessel-Track-OPC1 with 3,200+ tags), and noting that CLI/process logs are
        inaccessible due to the customer's IT security policy.
        Award 12 pts for gathering 3–4 of these evidence points.
        Award 5 pts for gathering 1–2 evidence points only.
        Award 0 pts for escalating immediately without gathering any evidence.

    - name: Escalation decision
      max_points: 25
      description: |
        Did the trainee correctly decide to escalate rather than attempt an L0 fix?

        Award 25 pts for explicitly stating this is a platform-level issue (OOM restarts
        consistent with a memory leak in the OPC UA driver under high tag counts) that
        requires engineering, and that no L1 fix exists without CLI access or a patch.
        Award 15 pts for escalating but without a clear stated reason why L0 cannot
        resolve it.
        Award 0 pts for attempting an L1 resolution (e.g. telling James to reduce tags,
        schedule restarts, or upgrade) without escalation.

    - name: Escalation note quality
      max_points: 20
      description: |
        Did the escalation note include all information L2 Engineering would need to
        act on this immediately?

        Award 20 pts for an escalation note covering: LE version (4.0.6), device type
        and tag count (OPC UA, 3,200+ tags), restart interval and frequency, OOM log
        evidence with specific text, note that CLI logs are inaccessible, compliance
        deadline with 48-hour window, and a clear statement of what was already ruled out.
        Award 12 pts for a note that covers most but is missing 1–2 critical elements.
        Award 5 pts for a brief summary that lacks key details L2 would need to begin
        their investigation.

  critical_penalties:
    - condition: wrong_direction
      cap: cap_at_50
      applies_to_checkpoints: [3]
