id: dh-s02
title: Modbus device shows Disconnected but tag data is still flowing
mode: practice
difficulty: beginner
expected_action: resolve

customer:
  name: Diane Okafor
  company: Gulf Manufacturing Solutions
  le_version: "4.0.6"

ticket:
  subject: "Modbus device showing Disconnected — is the hardware broken?"
  initial_message: |
    Hello,

    I need help urgently. We have a Modbus device in Litmus Edge (our compressor unit,
    "Compressor-A1") and it's been showing a red "Disconnected" status almost constantly
    for the past two days. Occasionally it flickers to Connected for a second and then
    goes red again.

    I'm not a network person, but I'm worried our hardware is broken. We just upgraded
    Litmus Edge recently and the problem started right after.

    Can someone please look at this? This compressor monitors critical pressure and
    temperature for our production line.

    Diane Okafor
    OT Supervisor
    Gulf Manufacturing Solutions

diagnostic_checklist:
  - "Reassure Diane and ask her to check if any tags are still showing live data values"
  - "Ask Diane to check the device log in DeviceHub for any error messages"
  - "Identify when the issue started — confirm whether it was after the LE upgrade"
  - "Guide Diane to find the Status Register field in the device settings"
  - "Have Diane change the Status Register address to a valid register (e.g., address 1)"

root_cause: |
  Litmus Edge uses a background health probe to determine the Connected/Disconnected UI status
  for Modbus devices. This probe polls a configurable "status register" address on the device.
  If the poll succeeds, the device shows Connected; if it fails, the device shows Disconnected.

  The default status register address (address 0) doesn't exist on this customer's compressor
  unit. When Litmus Edge polls that address, the Modbus device returns an "illegal data address"
  exception (Modbus exception code 2). Litmus Edge interprets this as a connection failure and
  marks the device Disconnected.

  Critically, this status probe is completely separate from tag polling. The customer's actual
  tags (temperature, pressure) are polling valid registers and returning real data — data IS
  flowing even though the UI shows Disconnected.

  This started after the LE upgrade because the upgrade reset the default status register config.

  Fix: in the DeviceHub device settings, change the status register address to a register that
  actually exists on the compressor (e.g., register 1). The probe will then succeed and the
  device will show Connected.

correct_response_summary: |
  1. First confirm that tag data IS actually flowing despite the Disconnected badge
  2. Check the device log for "illegal data address" / Modbus exception 2 errors on the probe
  3. Explain that the Connected/Disconnected badge comes from a separate health probe, not tag polling
  4. Navigate to the device settings in DeviceHub and locate the Status Register field
  5. Change the address to a register that exists on the compressor (register 1)
  6. Save settings and verify the device now shows Connected consistently

# ── Scripted customer simulation ─────────────────────────────────────────────
scripted_replies:
  - triggers:
      - "data"
      - "tag"
      - "value"
      - "reading"
      - "temperature"
      - "pressure"
      - "still showing"
      - "any values"
    reply: |
      Oh! Actually, yes — I can see temperature showing 87.3°C and pressure showing 4.2 bar.
      Both values are updating every few seconds. I assumed the hardware was broken because
      of the red status, but the numbers look normal.

  - triggers:
      - "log"
      - "device log"
      - "error"
      - "check the log"
      - "any messages"
    reply: |
      I've opened the device log. I see this message repeating over and over, roughly every
      5 to 10 seconds:
      "read register failed error=\"modbus: exception '2' (illegal data address), function '131'\""
      Is that the problem?

  - triggers:
      - "when did it start"
      - "upgrade"
      - "after the upgrade"
      - "started"
      - "before"
    reply: |
      It started exactly after the Litmus Edge upgrade two days ago. Before that it was fine —
      green Connected badge all the time.

  - triggers:
      - "hardware"
      - "physically"
      - "compressor running"
      - "control panel"
      - "broken"
    reply: |
      The compressor is physically running — no alarms on the control panel and everything
      looks normal on the plant floor. The hardware seems fine.

  - triggers:
      - "settings"
      - "device settings"
      - "status register"
      - "health probe"
      - "configuration"
      - "register address"
    reply: |
      I've opened the device settings. I can see a field called "Status Register" — it's
      currently set to address 0. Is that what I need to change?

  - triggers:
      - "address 1"
      - "change it to 1"
      - "set it to 1"
      - "change the address"
      - "update the register"
    reply: |
      I've changed the Status Register to address 1 and saved. The device just switched to
      green "Connected"! It's been green for a couple of minutes now without flickering.
      That was it!

  - triggers:
      - "restart"
      - "reboot"
      - "try restarting"
    reply: |
      I tried restarting it yesterday but it didn't help — the Disconnected badge just came
      back right away.

  - triggers:
      - "verify"
      - "confirm"
      - "is it working"
      - "still connected"
      - "staying connected"
    reply: |
      Yes, it's staying green! The device shows Connected and the temperature and pressure
      values are still updating normally. Thank you so much — I was really worried it was
      a hardware problem.

fallback_reply: |
  I'm sorry, I'm not sure what you mean. Could you give me step-by-step instructions?
  I'm not very technical when it comes to this system.

grading_rubric:
  pass_threshold: 70
  dimensions:
    - name: Root cause identification
      max_points: 40
      description: |
        Did the trainee identify that the Disconnected status is caused by a health probe polling
        an invalid Modbus register address (address 0), and that actual tag data is unaffected?
        Award full points for correctly distinguishing the health probe mechanism from tag polling.
        Award 20 pts if they identified a configuration issue but not the specific probe mechanism.
        Award 0 pts for concluding hardware is broken, recommending device replacement, or focusing
        only on network/hardware diagnostics.

    - name: Diagnostic quality
      max_points: 35
      description: |
        Did the trainee first check whether tag data is actually flowing (verifying data is OK
        despite the badge)? Did they look at device logs for the "illegal data address" error?
        Award full points for both steps. Award 20 pts for checking logs but not confirming data flow
        first. Award 10 pts for skipping log investigation and jumping straight to the fix.

    - name: Resolution accuracy
      max_points: 25
      description: |
        Were the resolution steps accurate and complete? Full points for: locate status register
        setting → change to a valid register address → verify device shows Connected. Deduct 10 pts
        if the fix was device restart rather than changing the health probe address. Deduct 5 pts
        if the verification step was omitted.

  critical_penalties:
    - condition: wrong_direction
      cap: cap_at_50
      applies_to_checkpoints: []
