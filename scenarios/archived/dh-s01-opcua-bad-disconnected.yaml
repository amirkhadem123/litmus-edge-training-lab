id: dh-s01
title: OPC UA tags stuck at Bad:Disconnected despite device showing Connected
mode: practice
difficulty: intermediate
expected_action: resolve

customer:
  name: Marcus Weber
  company: Steinberg Precision Components
  le_version: "4.0.6"

ticket:
  subject: "OPC UA device connected but all tags showing Bad:Disconnected — no data in historian"
  initial_message: |
    Hi,

    We're seeing a strange issue with one of our OPC UA devices in Litmus Edge. The device
    (CNC-Line3-OPC) shows as "Connected" in DeviceHub, but almost all of our tags are stuck
    showing a "Bad:Disconnected" quality status. No data is making it to the historian.

    This started happening a few days ago. Restarting the device in DeviceHub temporarily
    brings the tags back — they show good data for maybe 10–15 minutes — but then they drop
    back to Bad:Disconnected again.

    The underlying OPC UA server (Kepware) is fine. We have other clients connected to it
    and they're reading data without any issues. This looks like something on the Litmus Edge
    side.

    We're running a CNC machining line and losing production visibility. Any help appreciated.

    Marcus Weber
    Controls Systems Engineer
    Steinberg Precision Components

diagnostic_checklist:
  - "Ask Marcus to open the device log in DeviceHub — look for any recurring error messages"
  - "Ask whether any tags were recently added, removed, or modified (especially manually)"
  - "Find out exactly when the issue started and whether any changes were made around that time"
  - "Confirm whether ALL tags are affected or only some — ask Marcus to check a few specific ones"
  - "Ask to verify whether the OPC UA node paths in the problematic tags still exist on Kepware"

root_cause: |
  A technician manually added several tags to the CNC-Line3-OPC device last week.
  These tags were entered with incorrect OPC UA node IDs (e.g., ns=2;s=CNC_Line3.Spindle.BadRegister)
  that do not exist on the Kepware OPC UA server.

  Litmus Edge's OPC UA driver creates monitored items for all tags on the device. When it attempts
  to subscribe to the invalid node IDs, the OPC UA server returns BadNodeIdUnknown errors. The driver
  floods with subscription failures, eventually overwhelming its internal state and dropping the
  monitored item subscriptions for ALL tags — including the valid ones. The device appears
  "Connected" at the TCP/session level but the tag subscriptions are broken.

  Restarting clears the subscription state momentarily, but the driver immediately re-subscribes
  to all tags (including the bad ones) and the cycle repeats within minutes.

  Fix: identify and delete the tags with invalid node IDs, then restart the device.

correct_response_summary: |
  1. Ask Marcus to open the device in DeviceHub and navigate to the device logs
  2. Look for repeated errors containing "BadNodeIdUnknown" — note the node IDs mentioned
  3. Cross-reference those node IDs against the tag list to find the tags with bad node paths
  4. Delete the invalid tags (the ones with node IDs returning BadNodeIdUnknown)
  5. Restart the device in DeviceHub (Stop → Start)
  6. Verify remaining tags return to "Good" quality and data resumes in the historian

# ── Scripted customer simulation ─────────────────────────────────────────────
scripted_replies:
  - triggers:
      - "log"
      - "event log"
      - "device log"
      - "error message"
      - "any errors"
      - "check the log"
    reply: |
      I've opened the device log. There are a lot of repeated lines — they appear every few seconds:
      "Create monitored item 'ns=2;s=CNC_Line3.Spindle.BadRegister' failed: BadNodeIdUnknown"
      "Create monitored item 'ns=2;s=CNC_Line3.Aux.TestPoint99' failed: BadNodeIdUnknown"
      There are a couple more with similar patterns. They keep repeating continuously.

  - triggers:
      - "recently add"
      - "recently chang"
      - "configuration change"
      - "any change"
      - "what changed"
      - "when did it start"
      - "around the same time"
      - "last week"
    reply: |
      Now that you mention it — one of our technicians was adding new tags to the device last week
      to expand our monitoring coverage. The problem started a day or two after that. I didn't
      connect those two things until now.

  - triggers:
      - "tag list"
      - "which tags"
      - "look at the tags"
      - "unusual tag"
      - "test tag"
      - "list of tags"
    reply: |
      Looking at the tag list... most of them look normal — spindle speed, feed rate, temperatures.
      But there are four or five with odd names: BadRegister, TestPoint99, DebugChannel1, AuxMonitor2.
      Those don't match anything our operators would normally monitor.

  - triggers:
      - "node id"
      - "node path"
      - "ns="
      - "node address"
    reply: |
      I can see the node IDs for those unusual tags. They look different from the others —
      the paths like "ns=2;s=CNC_Line3.Spindle.BadRegister" don't match anything I recognize
      in our Kepware configuration.

  - triggers:
      - "kepware"
      - "opc server"
      - "other client"
      - "other system"
      - "scada"
      - "server is fine"
    reply: |
      Yes, our SCADA system and a few other OPC UA clients are all reading from Kepware without
      any issues. The Kepware server itself is definitely running and responding normally.

  - triggers:
      - "restart"
      - "restarted"
      - "reboot"
      - "stop and start"
      - "tried restart"
    reply: |
      Yes, I've restarted the device several times. It does bring the data back — but only
      for about 10 to 15 minutes before it drops to Bad:Disconnected again.

  - triggers:
      - "all tags"
      - "how many tags"
      - "every tag"
      - "all affected"
    reply: |
      Almost all of them — we have around 40 tags on that device and maybe 35 or 36 are
      showing Bad:Disconnected. A couple seem to be intermittently OK but most are stuck.

  - triggers:
      - "delete"
      - "remove the tag"
      - "remove those tags"
      - "get rid of"
    reply: |
      I've deleted those four tags with the unusual names. Should I restart the device now?

  - triggers:
      - "start the device"
      - "start it"
      - "restart now"
      - "restart the device"
      - "after deleting"
    reply: |
      Done — I stopped and restarted the device. The tags are coming back up and they're
      showing "Good" quality now. Data is flowing into the historian again. Looks like that fixed it!

  - triggers:
      - "verify"
      - "confirm"
      - "check now"
      - "is it working"
      - "data flowing"
      - "good quality"
    reply: |
      Yes — all the remaining tags are showing "Good" quality and the values are updating
      in real time. The historian is receiving data again. Thank you!

fallback_reply: |
  I'm not sure I follow — could you be more specific about what you need me to check or do?

grading_rubric:
  pass_threshold: 70
  dimensions:
    - name: Root cause identification
      max_points: 40
      description: |
        Did the trainee identify that invalid OPC UA node IDs on manually-added tags are causing
        BadNodeIdUnknown errors, which in turn break subscriptions for ALL tags? Award full points
        for clearly connecting the bad node IDs to the subscription failure cascade. Award 20 pts
        if they identified bad tags but not why they affect all subscriptions. Award 0 pts if they
        blamed the OPC UA server, network, or recommended restart as the permanent fix.

    - name: Diagnostic quality
      max_points: 35
      description: |
        Did the trainee systematically guide Marcus to find the evidence? Award full points for:
        asking about device logs AND asking about recent configuration changes AND connecting the
        technician's tag additions to the log errors. Award 20 pts for checking logs but not asking
        about changes. Award 10 pts for identifying the bad tags without going through the diagnostic
        steps (guessing the answer).

    - name: Resolution accuracy
      max_points: 25
      description: |
        Were the resolution steps correct and complete? Full points for: delete bad tags → restart
        device → verify data resumes. Deduct 10 pts for recommending restart without tag deletion.
        Deduct 5 pts for skipping the verification step.

  critical_penalties:
    - condition: wrong_direction
      cap: cap_at_50
      applies_to_checkpoints: []
