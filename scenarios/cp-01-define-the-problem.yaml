id: cp-01
title: "Dashboard data stopped updating — plant floor sensor"
mode: certificate
checkpoint: 1
difficulty: beginner
expected_action: resolve

customer:
  name: Sarah Chen
  company: Riverside Plastics Corp
  le_version: "4.0.6"
  role: Operations Manager
  litmus_certified: false
  ui_access: true
  technical_level: low

ticket:
  subject: "Production dashboard stopped updating — temperature readings frozen"
  initial_message: |
    Hi,

    I'm Sarah Chen, Operations Manager at Riverside Plastics Corp. I'm hoping
    you can help — our production monitoring dashboard stopped showing live data
    this morning. All the temperature readings are stuck and not updating at all.
    Everything was working fine yesterday, but when our operators came in today
    the numbers were frozen.

    We rely on this dashboard to monitor the plant floor, so any help getting it
    working again would be much appreciated.

    Thanks,
    Sarah

diagnostic_checklist:
  - Ask about device status in DeviceHub — is the device running or stopped?
  - Identify which device / tag is affected (name, location)
  - Establish precise timing — when exactly did values stop updating?
  - Ask what changed — did anyone access the system around that time?
  - Guide Sarah to DeviceHub (she is not Litmus-certified — give step-by-step navigation)
  - Confirm the device status badge and report back before taking action
  - Verify dashboard values resume updating after the fix

platform_context: |
  Litmus Edge is a web-based industrial IoT platform accessed through a browser. Key areas:

  DeviceHub — the main screen for managing connected field devices (PLCs, sensors, OPC UA
  servers, etc.). Accessed via the left sidebar navigation. Shows a list of configured
  devices, each with a status badge: green "Connected" means the device is actively polling
  and publishing data; grey "Stopped" means the device has been manually paused and is not
  collecting data; red "Disconnected" means the driver cannot reach the device. Each device
  row has action controls including Start (resumes polling) and Stop (pauses polling).
  Clicking a device opens its detail view, which includes its tag list, configuration
  settings, and a device log showing recent driver activity.

  Tags — each device has one or more tags representing individual data points (e.g., a
  temperature reading, a flow rate). Tags have configuration including a polling or sampling
  interval specified in milliseconds. A tag showing "Good" quality means the last received
  value was valid; this does not mean the value is current.

  Historian / Dashboard — time-series data from tags is stored and can be visualised.
  If a device is Stopped or Disconnected, its tags stop receiving new values and appear
  frozen on the dashboard.

customer_persona: |
  Sarah is an Operations Manager at a mid-size plastics manufacturing plant. She is
  not a technical user — she relies on her IT team and the Litmus support team for
  anything beyond day-to-day software use. She has not taken the Litmus User Certificate,
  so she does not know what DeviceHub is, what "Stopped" means in a device context, or
  how the platform works internally. However, she is patient, cooperative, and will follow
  step-by-step instructions carefully and report back exactly what she sees on screen.
  She communicates in plain, non-technical language and occasionally misremembers exact
  timing or phrasing. She is mildly worried about the dashboard situation because her
  operators rely on it, but she is not panicking.

customer_knowledge:
  observes: |
    The production dashboard has been showing frozen temperature values since
    approximately 9 AM this morning. The values are not updating at all — the numbers
    are stuck. Everything was working normally yesterday. She has Litmus Edge open in
    her browser and can navigate to any screen if told where to go.
  can_do: |
    Open any screen in Litmus Edge if directed there step by step. Follow instructions
    and click buttons as instructed. Report exactly what she sees — badge colours,
    status text, button labels, error messages — as precisely as she can describe them.
  does_not_know: |
    Why the dashboard stopped updating. What DeviceHub is or where to find it unless
    told. That a colleague visited the device list this morning. What a "Stopped"
    device state means or that it halts data collection. Any technical details about
    how Litmus Edge works internally.
  withheld:
    - info: >
        A colleague (Marcus from the IT team) was browsing the device list in Litmus
        Edge around 8:50 AM and may have accidentally clicked something. Sarah only
        found this out when she asked him about it later.
      release_when: >
        analyst asks about recent activity in the system, whether anyone else accessed
        Litmus Edge this morning, whether any changes were made, or what happened around
        the time the issue started
  what_you_see: |
    DeviceHub (when directed there):
      The device list shows several devices. "PlantFloor-TempSensor1" is visible in
      the list. Next to its name there is a grey badge or label — it says "Stopped".
      There are two small buttons beside it — one appears to be a play/start button
      and one a stop button. No error message or alert is visible on the device row.

    Dashboard (when checking values):
      Before fix: all temperature readings are frozen — the numbers are not changing.
      After clicking Start and waiting a moment: the values begin updating every few
      seconds, fluctuating as expected for live sensor data.

# ── Internal documentation (not shown to trainee — used by grading agent only) ─

root_cause: |
  The device "PlantFloor-TempSensor1" was manually stopped in DeviceHub by a colleague
  (Marcus from IT) at approximately 8:52 AM while reviewing the device list. He
  accidentally clicked the Stop button and did not realise it would halt all tag
  polling and data publishing for that device.

  The physical sensor is running normally. The issue is entirely within Litmus Edge:
  the device is in a "Stopped" state, which pauses data collection without any
  visible alarm or dashboard notification.

  Fix: navigate to DeviceHub, locate PlantFloor-TempSensor1, click Start. Data
  collection resumes immediately and dashboard values will begin updating within
  one polling cycle.

correct_response_summary: |
  1. Send a proactive first response: ask what the device status shows in DeviceHub
     (closed question), list the most common causes for frozen dashboard values
     (stopped device service, driver misconfiguration, lost network path), and include
     a link to the relevant DeviceHub troubleshooting documentation.
  2. Guide Sarah to DeviceHub — explain where it is since she does not have the
     Litmus User Certificate.
  3. Ask her to locate PlantFloor-TempSensor1 and report its status badge.
  4. On learning the device shows "Stopped", explain what this means and instruct
     her to click Start.
  5. Ask Sarah to confirm that the dashboard values are updating again before closing.

# ── Grading rubric ────────────────────────────────────────────────────────────

grading_rubric:
  pass_threshold: 70
  dimensions:
    - name: Proactive first response
      max_points: 40
      description: |
        Evaluate the quality of the trainee's first response. A full-mark response
        contains all three layers of the proactive model:
        (1) Targeted closed questions — asking about the specific device status
            rather than open questions like "can you tell me more?"
        (2) A ranked list of the most common causes for frozen dashboard values
            — at minimum: stopped device state, driver misconfiguration, lost
            network path to the device.
        (3) A specific documentation link (or clear reference) rather than a
            generic "check our docs" suggestion.

        Award 40 pts for all three layers present and well-formed.
        Award 25 pts for closed questions + cause list but no documentation link.
        Award 20 pts for closed questions only, no cause list or link.
        Award 10 pts for a response that directs Sarah to DeviceHub but uses
            open-ended questions ("can you tell me what you see?").
        Award 0 pts for recommending physical sensor inspection, network
            diagnostics, or IT contact as the first step.

    - name: Symptom extraction
      max_points: 35
      description: |
        Evaluate whether the trainee obtained enough of the five symptom elements
        (Behavior, Location, Timing, Frequency, What Changed) to identify the problem.

        Behavior and Location are already in the opening message. The trainee
        must actively extract Timing (when exactly), and most importantly What Changed
        (who accessed the system / what happened around 9 AM) — this is the key
        diagnostic element that leads to the root cause.

        Award 35 pts for extracting Timing precisely AND asking what changed /
            who accessed the system this morning (which surfaces the withheld
            information about the colleague).
        Award 20 pts for asking about Timing but not asking about recent activity
            or changes.
        Award 10 pts for not asking about Timing or changes at all, and jumping
            directly to the fix without establishing the full symptom picture.
        Award 0 pts for accepting the customer's initial vague description without
            asking any clarifying questions.

    - name: Resolution accuracy
      max_points: 25
      description: |
        Evaluate whether the resolution was correct and complete.

        Full resolution path: guide Sarah to DeviceHub (with navigation help since
        she is not certified) → confirm the device shows Stopped → instruct her
        to click Start → ask her to verify the dashboard values are updating.

        Award 25 pts for the complete path including navigation guidance and
            the verification ask at the end.
        Award 15 pts for correct resolution steps but skipping the verification ask.
        Award 10 pts for identifying the stopped device but recommending a
            platform-level restart rather than just starting the individual device.
        Award 0 pts for an incorrect resolution (e.g. hardware inspection,
            reinstalling, contacting IT to restart the server).

  critical_penalties:
    - condition: wrong_direction
      cap: cap_at_50
      applies_to_checkpoints: [1]
