id: cp-02
title: "OPC UA tags show Good quality but values appear completely frozen"
mode: certificate
checkpoint: 2
difficulty: intermediate
expected_action: resolve

customer:
  name: Carlos Medina
  company: Apex Process Systems
  le_version: "4.0.6"
  role: Controls Engineer
  litmus_certified: true
  ui_access: true
  technical_level: high

ticket:
  subject: "OPC UA tags show Good quality but values appear completely frozen"
  initial_message: |
    Hello,

    We have an OPC UA device ("Process-Monitor-OPC1") in Litmus Edge that's been behaving
    strangely since yesterday afternoon. The device shows "Connected" in DeviceHub and all
    18 tags are showing "Good" quality — so it looks healthy on the surface. But the values
    haven't changed in several hours, which is impossible for our process parameters
    (temperature and flow rates should be fluctuating constantly).

    I've already verified on the OPC UA server side that data is definitely changing there.
    Something is wrong on the Litmus Edge side, but since the device status shows Connected
    and all tags show Good, I can't identify the cause.

    Any help would be appreciated.

    Carlos Medina
    Controls Engineer
    Apex Process Systems

platform_context: |
  Litmus Edge is a web-based industrial IoT platform accessed through a browser. Key areas:

  DeviceHub — manages connected field devices. Shows a device list with status badges:
  green "Connected" (actively polling), grey "Stopped" (manually paused), red
  "Disconnected" (driver cannot reach the device). Clicking a device opens its detail
  view with the tag list, configuration settings, and a device log.

  Tags — each device has tags representing individual data points. Tag configuration
  includes a polling or sampling interval in milliseconds. Tag quality is reported
  as "Good" (last value was valid), "Bad", or "Uncertain". Good quality does NOT mean
  the value is current — a tag can show Good quality while its value is hours old if
  the polling interval is extremely long.

  Device log — visible from the device detail view. Shows timestamped entries from the
  driver process including subscription events, connection changes, and errors.

  OPC UA specifics — OPC UA devices use a subscription model where the Litmus Edge
  driver registers monitored items with the OPC UA server. "SubscriptionTransferFailed"
  entries appear when a monitoring client (such as an external dashboard) disconnects
  and reconnects, trying to re-register its subscriptions. This is normal OPC UA
  protocol behaviour and does not affect tag polling by the Litmus Edge driver itself.

customer_persona: |
  Carlos is a Controls Engineer with solid experience in industrial automation and OPC UA.
  He has completed the Litmus User Certificate, so he knows his way around the Litmus Edge
  interface — DeviceHub, tag settings, device logs — without needing to be walked through it.
  He is technically confident, communicates precisely, and has already done some initial
  investigation before submitting the ticket. He is methodical and will follow diagnostic
  instructions carefully. He is frustrated but professional. He knows enough to know something
  is wrong but genuinely cannot identify the cause from what he can see.

customer_knowledge:
  observes: |
    The OPC UA device "Process-Monitor-OPC1" shows "Connected" in DeviceHub with a green badge.
    All 18 tags show "Good" quality. However, the values have not changed in several hours —
    temperature and flow rates should be fluctuating constantly. He has already verified on the
    OPC UA server side that data is changing there. The freezing started yesterday around 3 PM.
    He has Litmus Edge open and can navigate anywhere in the interface without guidance.
  can_do: |
    Navigate to any screen in DeviceHub independently. Check device logs, tag settings,
    configuration fields. Change configuration values and save them. Verify results after
    changes are applied.
  does_not_know: |
    Why the values are frozen when quality shows Good. That the polling interval was changed
    to 1,800,000ms (30 minutes) by the technician. That the SubscriptionTransferFailed log
    entries are benign and unrelated to the frozen values.
  withheld:
    - info: >
        A technician was doing configuration work on the device yesterday afternoon — testing
        different polling setups for a potential low-frequency monitoring project. He said he
        reverted everything before leaving, but Carlos is not completely sure he did.
      release_when: >
        analyst asks what changed before the issue started, whether any configuration work
        was done, who accessed the device settings, or when the issue began relative to
        any activity on the system
  what_you_see: |
    DeviceHub — device status:
      Process-Monitor-OPC1 shows a green "Connected" badge. All 18 tags are visible
      in the tag list and show "Good" quality. The last-received values look numerically
      plausible but are completely static — the same numbers have not changed.

    Device log (when asked to check):
      Repeated entries reading: "SubscriptionTransferFailed: subscription could not be
      transferred to new session, id=4821" (IDs vary). These appear in two clusters:
      roughly 20–30 entries around 2 PM yesterday, and another cluster around 8 AM
      this morning. No connection errors, timeouts, or driver crash messages are visible.

    Tag settings / polling interval (when asked to check):
      There is a field for polling interval (may be labeled "Update Interval" or
      "Sampling Rate"). The current value is 1800000. The unit is milliseconds.
      This applies to all 18 tags on the device.

    After fix (interval changed to 1000ms and saved):
      Tag values begin updating every second. Temperature and flow rate readings are
      visibly fluctuating in real time. The historian shows fresh data points arriving.

# ── Internal documentation (not shown to trainee — used by grading agent only) ─

root_cause: |
  The tag polling interval on Process-Monitor-OPC1 was accidentally set to 1,800,000ms
  (30 minutes) during configuration work by a technician the previous afternoon. He was
  testing a low-frequency sampling scenario and inadvertently saved the change to the
  production device without reverting it.

  At a 30-minute interval, tags appear completely static to operators used to 1-second
  updates. The OPC UA driver is technically working correctly — it IS polling the server —
  just extremely slowly. Tags show "Good" quality because the last received values are
  valid; the driver is not in an error state.

  The red herring: repeated "SubscriptionTransferFailed" warnings in the device log.
  These were generated by a separate dashboard integration client that reconnected after
  a brief network dropout and tried to re-register its subscriptions. This is normal OPC UA
  behaviour — it does not affect tag polling and is completely unrelated to the frozen values.

  Fix: in the device tag settings, change the polling/update interval from 1800000ms to
  1000ms. Tags will then update at 1-second intervals and values will appear live again.

correct_response_summary: |
  1. Confirm device is Connected and tags show Good — this rules out connection errors
  2. Ask when the freezing started and what changed — surfaces the technician's work
  3. Check device log → SubscriptionTransferFailed warnings appear, but recognise
     these are from a reconnecting dashboard client, not related to the polling issue
  4. Ask Carlos to look at the tag polling/update interval setting
  5. Find the interval set to 1800000ms (30 minutes) — this is the actual problem
  6. Change to 1000ms, save, and verify that tag values begin updating rapidly

# ── Grading rubric ────────────────────────────────────────────────────────────

grading_rubric:
  pass_threshold: 70
  dimensions:
    - name: Elimination sequence
      max_points: 30
      description: |
        Did the trainee work through at least 3 distinct elimination steps before
        arriving at the root cause?

        Award 30 pts for a systematic sequence covering: (1) confirming device Connected
        and tags Good to rule out connection issues, (2) asking about recent changes to
        surface the technician's configuration work, (3) checking the device log, and
        (4) investigating the tag polling interval setting.
        Award 20 pts for 2–3 steps with minor gaps but clear direction.
        Award 0 pts for jumping directly to "check the polling interval" without any
        diagnostic steps — even if the guess is correct, the method was not followed.

    - name: Red herring handling
      max_points: 25
      description: |
        Did the trainee correctly identify the SubscriptionTransferFailed log entries
        as benign and not the root cause?

        Award 25 pts for explicitly recognising the log warnings as a reconnecting
        dashboard client behaviour (not a tag polling issue) and moving on to deeper
        investigation.
        Award 10 pts for acknowledging the logs without getting stuck on them but also
        without explaining why they are not the cause.
        Deduct 15 pts (apply 0 pts to this dimension) if the trainee concluded the
        subscription errors ARE the root cause and attempted to address them.

    - name: Evidence quality
      max_points: 25
      description: |
        Did the trainee obtain concrete evidence for the actual root cause before
        prescribing a fix?

        Award 25 pts for asking Carlos to check the tag polling interval setting and
        finding the 1800000ms value as direct, specific evidence before recommending
        the change.
        Award 15 pts for hypothesising a configuration issue and directing Carlos to
        check settings, but without asking for the specific value before prescribing
        the fix.
        Award 5 pts for reaching the correct fix by hypothesis without evidence.

    - name: Resolution accuracy
      max_points: 20
      description: |
        Were the resolution steps correct and complete?

        Award 20 pts for: identify polling interval at 1800000ms → instruct Carlos to
        change to 1000ms → save → ask Carlos to verify values are updating live.
        Deduct 10 pts for recommending a device or service restart as the fix.
        Deduct 5 pts for skipping the verification step after the change.

  critical_penalties:
    - condition: wrong_direction
      cap: cap_at_50
      applies_to_checkpoints: [2]
    - condition: sequence_skipped
      cap: cap_at_40
      applies_to_checkpoints: [2]
