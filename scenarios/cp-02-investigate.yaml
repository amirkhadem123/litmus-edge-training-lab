id: cp-02
title: "OPC UA tags show Good quality but values appear completely frozen"
mode: certificate
checkpoint: 2
difficulty: intermediate
expected_action: resolve

customer:
  name: Carlos Medina
  company: Apex Process Systems
  le_version: "4.0.6"

ticket:
  subject: "OPC UA process tags connected and showing Good — but values not changing for hours"
  initial_message: |
    Hello,

    We have an OPC UA device ("Process-Monitor-OPC1") in Litmus Edge that's been behaving
    strangely since yesterday afternoon. The device shows "Connected" in DeviceHub and all
    tags are showing "Good" quality — so it looks healthy. But the values haven't changed
    in several hours, which is impossible for our process parameters (temperature and flow
    rates should be fluctuating constantly).

    I've checked the OPC UA server side and data is definitely changing there. Something
    is wrong on the Litmus Edge side — but since the status shows Connected and Good, I'm
    at a loss.

    Any help appreciated.

    Carlos Medina
    Controls Engineer
    Apex Process Systems

diagnostic_checklist:
  - "Confirm the device shows Connected and tags show Good quality (eliminate network/connection issue)"
  - "Ask Carlos when the freezing started and what was changed before it happened"
  - "Ask Carlos to check the device log in DeviceHub for any warnings or error patterns"
  - "Look carefully at the device log — identify the SubscriptionTransferFailed lines but note they are not the root cause"
  - "Ask Carlos to check the tag settings, specifically the polling/update interval"
  - "Guide Carlos to change the polling interval from 1800000ms to 1000ms and verify data updates"

root_cause: |
  The tag polling interval on Process-Monitor-OPC1 was accidentally set to 1,800,000ms (30 minutes)
  during configuration work last week. A technician was testing a low-frequency sampling scenario and
  inadvertently saved the change to the production device without reverting it.

  At a 30-minute interval, tags appear completely static to operators used to 1-second updates.
  The OPC UA driver is technically working correctly — it IS polling the server — just extremely
  slowly. The tags show "Good" quality because the last received values are valid; the driver
  isn't in an error state.

  The red herring in the device log is repeated "SubscriptionTransferFailed" warnings. These are
  generated by an OPC UA monitoring client (a separate dashboard integration) that reconnected
  after a brief network dropout and tried to re-register its subscriptions. This is a benign
  OPC UA protocol behavior — it does not affect tag polling and was coincidentally logged around
  the same time the slow-polling issue was noticed.

  Fix: in the device tag settings, change the polling/update interval from 1800000ms to 1000ms.
  Tags will then update at 1-second intervals and values will appear live again.

correct_response_summary: |
  1. Confirm the device is Connected and tags show Good (this rules out connection/subscription failures)
  2. Ask when the freezing started and what changed — the technician's configuration work
  3. Check device logs → see SubscriptionTransferFailed warnings, but recognize these are benign
  4. Dig deeper: ask Carlos to look at the tag polling/update interval setting
  5. Find the interval set to 1800000ms (30 minutes) — this is the actual problem
  6. Change the interval to 1000ms, save, and verify that tag values begin updating rapidly

# ── Scripted customer simulation ─────────────────────────────────────────────
scripted_replies:
  - triggers:
      - "connected"
      - "status"
      - "confirm connected"
      - "device status"
      - "device showing"
      - "quality"
      - "tag quality"
    reply: |
      Yes — device shows "Connected" with a green badge, and all 18 tags show "Good" quality.
      The last values look plausible, just completely static. Nothing is flagging as an error.

  - triggers:
      - "when did it start"
      - "what changed"
      - "any changes"
      - "yesterday"
      - "before it happened"
      - "configuration"
      - "who changed"
    reply: |
      It started yesterday around 3 PM. We had a technician doing some configuration work on
      that device — testing different polling setups for a potential low-frequency monitoring
      project. He said he reverted his changes before leaving, but maybe something was saved.

  - triggers:
      - "log"
      - "device log"
      - "check the log"
      - "any warnings"
      - "error"
    reply: |
      I've opened the device log. I can see a lot of lines like:
      "SubscriptionTransferFailed: subscription could not be transferred to new session, id=4821"
      These appear in clusters — maybe 20–30 entries around 2 PM yesterday, then again this
      morning around 8 AM. Other than that, no connection errors.

  - triggers:
      - "subscription"
      - "SubscriptionTransferFailed"
      - "what does that mean"
      - "is that the problem"
      - "transfer failed"
    reply: |
      Are those subscription transfer errors the cause? I wasn't sure if they were significant —
      they seemed to come from one of our dashboard clients reconnecting.

  - triggers:
      - "tag setting"
      - "polling interval"
      - "update interval"
      - "sampling rate"
      - "update rate"
      - "interval"
      - "tag configuration"
    reply: |
      I'm looking at the tag settings now. I see a polling interval field — it's set to 1800000.
      That seems large. Is that in milliseconds? That would be... 30 minutes?

  - triggers:
      - "1000"
      - "change the interval"
      - "change it to"
      - "set the interval"
      - "update the interval"
    reply: |
      I've changed the polling interval to 1000ms on all tags and saved. Wow — the values
      are updating every second now. I can see the temperature and flow rate fluctuating
      in real time. That was definitely the issue.

  - triggers:
      - "opc server"
      - "server side"
      - "check the server"
      - "opc ua server"
    reply: |
      Yes, I've already verified on the OPC UA server side — the data there is changing
      constantly, as expected. The problem is definitely on the Litmus Edge side.

  - triggers:
      - "restart"
      - "reboot"
      - "restart the device"
    reply: |
      I tried restarting the device in DeviceHub but it didn't change anything — the values
      are still frozen at the same numbers.

  - triggers:
      - "verify"
      - "is it working"
      - "check now"
      - "updating now"
      - "fixed"
    reply: |
      Yes, all values are updating correctly now — every second, as expected. The tags look
      completely live and the historian is receiving fresh data points. Thank you!

  - triggers:
      - "all tags"
      - "which tags"
      - "same for all"
      - "how many"
    reply: |
      All 18 tags on that device appear frozen. They all had the same last-update timestamp —
      which matches when I think the technician finished his changes yesterday.

fallback_reply: |
  I see what you're asking. Let me check that — could you point me to where in DeviceHub I
  should be looking?

grading_rubric:
  pass_threshold: 70
  dimensions:
    - name: Elimination sequence
      max_points: 30
      description: |
        Did the trainee work through at least 3 distinct elimination steps before arriving at
        the root cause? Award full points for a systematic sequence: (1) confirm device Connected
        and tags Good, (2) ask about recent changes, (3) check logs, (4) investigate tag settings.
        Award 20 pts for 2–3 steps with minor gaps. Award 0 pts for jumping directly to the fix
        without diagnostic steps.

    - name: Red herring handling
      max_points: 25
      description: |
        Did the trainee correctly identify the SubscriptionTransferFailed log entries as benign
        and not the root cause? Award full points for explicitly noting the log warnings are from
        a reconnecting client (not a tag-polling issue) and moving on to deeper investigation.
        Award 10 pts for acknowledging the logs but staying stuck on them. Deduct 15 pts if the
        trainee concluded the subscription errors ARE the root cause and tried to fix those.

    - name: Evidence quality
      max_points: 25
      description: |
        Did the trainee gather concrete evidence for the actual root cause before prescribing
        a fix? Award full points for asking Carlos to check the polling interval setting and
        finding the 1800000ms value as direct evidence. Award 15 pts for hypothesizing a
        configuration issue but not asking Carlos to verify the specific setting. Award 5 pts
        for reaching the right fix by luck without gathering evidence.

    - name: Resolution accuracy
      max_points: 20
      description: |
        Were the resolution steps correct? Full points for: identify polling interval at
        1800000ms → change to 1000ms → save → verify live updates. Deduct 10 pts if the
        trainee recommended restarting the device or LE service as the fix. Deduct 5 pts
        for skipping verification.

  critical_penalties:
    - condition: wrong_direction
      cap: cap_at_50
      applies_to_checkpoints: []
    - condition: sequence_skipped
      cap: cap_at_40
      applies_to_checkpoints: [2]
