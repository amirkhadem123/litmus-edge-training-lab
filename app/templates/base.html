<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Litmus Support Lab{% endblock %}</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f2f8f6;
      color: #032125;
      min-height: 100vh;
      line-height: 1.6;
    }

    a { color: #002f2b; text-decoration: none; }
    a:hover { text-decoration: underline; color: #3adb90; }

    /* ── Header ───────────────────────────────────────────────────────── */
    .header {
      background: #002f2b;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      height: 52px;
    }
    .header-logo-img {
      height: 28px;
      width: auto;
      display: block;
      flex-shrink: 0;
    }
    .header-divider {
      width: 1px;
      height: 22px;
      background: rgba(242, 248, 246, 0.2);
      flex-shrink: 0;
    }
    .header-logo {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
      text-decoration: none;
    }
    .header-logo:hover { text-decoration: none; }
    .logo-litmus {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #3adb90;
      text-transform: uppercase;
    }
    .logo-name {
      font-size: 0.95rem;
      font-weight: 400;
      color: #f2f8f6;
      letter-spacing: 0.01em;
    }
    .logo-version {
      font-size: 0.65rem;
      font-weight: 600;
      color: #5e9e8a;
      letter-spacing: 0.04em;
      align-self: flex-end;
      margin-bottom: 1px;
    }
    .header-nav { display: flex; gap: 0.25rem; margin-left: auto; }
    .header-nav a {
      font-size: 0.83rem;
      color: #9ee8c5;
      padding: 0.3rem 0.75rem;
      border-radius: 5px;
    }
    .header-nav a:hover {
      background: rgba(58, 219, 144, 0.15);
      color: #3adb90;
      text-decoration: none;
    }

    /* ── Layout ───────────────────────────────────────────────────────── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* ── Buttons ──────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      text-decoration: none;
    }
    .btn:hover { opacity: 0.82; text-decoration: none; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary  { background: #002f2b; color: #f2f8f6; }
    .btn-success  { background: #3adb90; color: #002f2b; }
    .btn-danger   { background: #9c3030; color: #f2f8f6; }
    .btn-warning  { background: #c87820; color: #f2f8f6; }
    .btn-ghost    { background: #e5f0ec; color: #032125; border: 1px solid #b5d6ce; }

    /* ── Badges ───────────────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-open     { background: #d4e4f0; color: #2a5478; }
    .badge-solved   { background: #c5f5e0; color: #002f2b; }
    .badge-escalate { background: #f5ddd0; color: #7c3d20; }
    .badge-beginner     { background: #c5f5e0; color: #002f2b; }
    .badge-intermediate { background: #fdecd0; color: #7c4e10; }
    .badge-advanced     { background: #e8d8f0; color: #5c3478; }

    /* ── Alert boxes ──────────────────────────────────────────────────── */
    .alert {
      padding: 0.85rem 1.1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      border-left: 4px solid;
    }
    .alert-warning { background: #fdf0d8; border-color: #c87820; color: #7c4e10; }
    .alert-info    { background: #ddeef8; border-color: #4a82a8; color: #2a4e6c; }
    .alert-success { background: #d5f5e8; border-color: #3adb90; color: #002f2b; }
    .alert-error   { background: #f8ddd8; border-color: #a83030; color: #6c1e1e; }

    /* ── Form elements ────────────────────────────────────────────────── */
    input[type="text"], select, textarea {
      background: #f7fbf9;
      border: 1px solid #b5d6ce;
      border-radius: 6px;
      color: #032125;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.5rem 0.75rem;
      width: 100%;
    }
    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #3adb90;
      box-shadow: 0 0 0 2px rgba(58, 219, 144, 0.25);
    }
    select option { background: #f7fbf9; }
    label {
      font-size: 0.85rem;
      color: #4a6e6a;
      display: block;
      margin-bottom: 0.3rem;
    }
    .form-group { margin-bottom: 1.25rem; }

    /* ── Spinner ──────────────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(3, 33, 37, 0.15);
      border-top-color: #3adb90;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Misc ─────────────────────────────────────────────────────────── */
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
    .text-muted { color: #5e8080; font-size: 0.85rem; }
    hr { border: none; border-top: 1px solid #c5dcd7; margin: 1.5rem 0; }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>

  <header class="header">
    <img src="/static/logo.png" alt="Litmus Academy" class="header-logo-img" />
    <div class="header-divider"></div>
    <a href="/dashboard" class="header-logo">
      <span class="logo-litmus">Litmus</span>
      <span class="logo-name">Support Lab</span>
      <span class="logo-version">v3.0</span>
    </a>
    <nav class="header-nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/settings">⚙ Settings</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}

</body>
</html>
